name: Build Android APK

on:
  push:
    branches:
      - fix/gameplay-controls-and-spawning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BattleCity-Gamer-fixed.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BattleCity-Gamer-fixed
          path: BattleCity-Gamer-fixed.apk
          if-no-files-found: error
